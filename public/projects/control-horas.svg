<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 180" fill="none" role="img" aria-label="Control de horas con semáforo de cumplimiento">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b08968"/>
      <stop offset="1" stop-color="#e0c4a8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#b08968" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#b08968" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- glow suave -->
  <ellipse cx="180" cy="88" rx="120" ry="70" fill="url(#glow)"/>

  <!-- tile (mismo motivo que las otras cards) -->
  <rect x="132" y="40" width="96" height="96" rx="22" fill="#1c2128" stroke="#2c313a" stroke-width="1.5"/>

  <!-- reloj -->
  <circle cx="176" cy="88" r="26" fill="#171b22" stroke="url(#acc)" stroke-width="3"/>
  <path d="M176 88 L176 70" stroke="url(#acc)" stroke-width="3" stroke-linecap="round"/>
  <path d="M176 88 L189 94" stroke="url(#acc)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="176" cy="88" r="2.4" fill="#e0c4a8"/>

  <!-- semáforo de cumplimiento -->
  <rect x="205" y="46" width="18" height="52" rx="9" fill="#121519" stroke="#2c313a" stroke-width="1.5"/>
  <circle cx="214" cy="58" r="4" fill="#6bbf7b"/>
  <circle cx="214" cy="72" r="4" fill="#4a4136"/>
  <circle cx="214" cy="86" r="4" fill="#4a3a3a"/>

  <!-- destellos -->
  <circle cx="96" cy="58" r="3" fill="#b08968"/>
  <circle cx="270" cy="70" r="2.5" fill="#e0c4a8"/>
  <circle cx="110" cy="120" r="2" fill="#8b949e"/>
  <circle cx="255" cy="118" r="2" fill="#b08968"/>
</svg>
